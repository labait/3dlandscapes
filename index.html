<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landscape Generator — 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #efe7d8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
      }
      #app {
        position: relative;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      #scene,
      #labels {
        position: absolute;
        inset: 0;
      }
      #labels {
        pointer-events: none;
      }
      .peak-label {
        position: relative;
        transform: translate(-50%, -100%);
        font: 500 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          monospace;
        color: rgba(255, 255, 255, 0.95);
        text-shadow:
          0 1px 0 rgba(0, 0, 0, 0.45),
          0 0 6px rgba(0, 0, 0, 0.35);
        white-space: nowrap;
        letter-spacing: 0.02em;
        padding: 1px 6px;
      }
      .peak-label::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 100%;
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.8);
        transform: translateX(-0.5px);
      }
      input[type="range"] {
        accent-color: #f1b814;
      }
    </style>
  </head>
  <body class="text-neutral-900">
    <div id="app">
      <div id="scene"></div>
      <div id="labels"></div>

      <header
        class="pointer-events-none absolute left-0 top-0 z-10 flex w-full items-start justify-between p-6"
      >
        <div class="pointer-events-auto">
          <h1
            id="landscapeTitle"
            class="font-mono text-2xl font-bold tracking-tight text-neutral-900 mix-blend-difference"
            style="color: white"
          >
            —
          </h1>
          <p
            class="font-mono text-[10px] uppercase tracking-[0.25em] text-neutral-100 mix-blend-difference"
          >
            3D Landscape Generator
          </p>
        </div>
      </header>

      <aside
        class="absolute right-6 top-6 z-20 w-72 rounded-2xl border border-black/10 bg-white/85 p-5 shadow-2xl backdrop-blur"
      >
        <div class="mb-4 flex items-center justify-between">
          <h2 class="font-mono text-sm font-semibold uppercase tracking-widest">
            Debug
          </h2>
          <span
            class="rounded-full bg-neutral-900/90 px-2 py-0.5 font-mono text-[10px] uppercase tracking-wider text-white"
            >controls</span
          >
        </div>

        <div class="space-y-5">
          <div>
            <div class="mb-1 flex items-center justify-between">
              <label
                for="baseWidth"
                class="font-mono text-[11px] uppercase tracking-wider text-neutral-700"
                >Base width (avg)</label
              >
              <span
                id="baseWidthValue"
                class="font-mono text-xs text-neutral-900"
                >28</span
              >
            </div>
            <input
              id="baseWidth"
              type="range"
              min="6"
              max="80"
              value="28"
              step="1"
              class="w-full"
            />
          </div>

          <div>
            <div class="mb-1 flex items-center justify-between">
              <label
                for="maxHeight"
                class="font-mono text-[11px] uppercase tracking-wider text-neutral-700"
                >Max peak height</label
              >
              <span
                id="maxHeightValue"
                class="font-mono text-xs text-neutral-900"
                >40</span
              >
            </div>
            <input
              id="maxHeight"
              type="range"
              min="5"
              max="120"
              value="40"
              step="1"
              class="w-full"
            />
          </div>

          <div>
            <div class="mb-1 flex items-center justify-between">
              <label
                for="colorOffset"
                class="font-mono text-[11px] uppercase tracking-wider text-neutral-700"
                >Color offset</label
              >
              <span
                id="colorOffsetValue"
                class="font-mono text-xs text-neutral-900"
                >0</span
              >
            </div>
            <input
              id="colorOffset"
              type="range"
              min="0"
              max="5"
              step="1"
              value="0"
              class="w-full"
            />
          </div>

          <div>
            <div class="mb-1 flex items-center justify-between">
              <label
                for="bumpAmount"
                class="font-mono text-[11px] uppercase tracking-wider text-neutral-700"
                >Bump amount</label
              >
              <span
                id="bumpAmountValue"
                class="font-mono text-xs text-neutral-900"
                >1.20</span
              >
            </div>
            <input
              id="bumpAmount"
              type="range"
              min="0"
              max="6"
              step="0.05"
              value="1.2"
              class="w-full"
            />
          </div>

          <div class="flex gap-2 pt-1">
            <button
              id="reshuffle"
              class="flex-1 rounded-lg border border-neutral-300 bg-neutral-50 px-3 py-2 font-mono text-[11px] uppercase tracking-wider text-neutral-900 transition hover:border-amber-500 hover:text-amber-700"
            >
              Reshuffle
            </button>
            <button
              id="resetView"
              class="flex-1 rounded-lg border border-neutral-300 bg-neutral-50 px-3 py-2 font-mono text-[11px] uppercase tracking-wider text-neutral-900 transition hover:border-amber-500 hover:text-amber-700"
            >
              Reset view
            </button>
          </div>
        </div>

        <div class="mt-5 border-t border-neutral-200 pt-4">
          <p
            class="mb-2 font-mono text-[10px] uppercase tracking-widest text-neutral-500"
          >
            Palette
          </p>
          <div id="paletteSwatches" class="flex gap-1.5"></div>
        </div>

        <div class="mt-4 border-t border-neutral-200 pt-3">
          <p class="font-mono text-[10px] leading-relaxed text-neutral-500">
            Drag = rotate · Right‑drag = pan · Wheel = zoom
          </p>
        </div>
      </aside>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import {
        CSS2DRenderer,
        CSS2DObject,
      } from "three/addons/renderers/CSS2DRenderer.js";

      // ---------- Example landscape ----------
      const bauhausLandscape = {
        name: "bauhaus",
        gradientColors: [
          "#F1FAEE",
          "#1D4E89",
          "#E63946",
          "#F1B814",
          "#E76F51",
          "#F1FAEE",
        ],
        items: Array.from({ length: 10 }, (_, i) => ({
          title: `item ${i + 1}`,
          height: 1 + Math.floor(Math.random() * 10),
        })),
      };

      // ---------- State ----------
      const state = {
        landscape: bauhausLandscape,
        positions: [],
        baseWidth: 28,
        maxHeight: 40,
        colorOffset: 0,
        bumpAmount: 1.2,
        noiseSeed: Math.random() * 1000,
        planeSize: 220,
        segments: 192,
      };

      // ---------- Procedural value noise ----------
      function hash2(ix, iz) {
        const s = Math.sin(
          ix * 12.9898 + iz * 78.233 + state.noiseSeed * 17.31,
        ) * 43758.5453;
        return (s - Math.floor(s)) * 2 - 1; // [-1, 1]
      }
      function smooth(t) {
        return t * t * (3 - 2 * t);
      }
      function valueNoise(x, z) {
        const ix = Math.floor(x);
        const iz = Math.floor(z);
        const fx = x - ix;
        const fz = z - iz;
        const a = hash2(ix, iz);
        const b = hash2(ix + 1, iz);
        const c = hash2(ix, iz + 1);
        const d = hash2(ix + 1, iz + 1);
        const u = smooth(fx);
        const v = smooth(fz);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }
      function fbm(x, z) {
        let total = 0;
        let amp = 1;
        let max = 0;
        let fx = x * 0.18;
        let fz = z * 0.18;
        for (let i = 0; i < 4; i++) {
          total += valueNoise(fx, fz) * amp;
          max += amp;
          amp *= 0.5;
          fx *= 2.07;
          fz *= 2.03;
        }
        return total / max;
      }

      // ---------- Three.js setup ----------
      const sceneEl = document.getElementById("scene");
      const labelsEl = document.getElementById("labels");

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      sceneEl.appendChild(renderer.domElement);

      const labelRenderer = new CSS2DRenderer({ element: labelsEl });
      labelRenderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xefe7d8);
      scene.fog = new THREE.Fog(0xefe7d8, 220, 460);

      const camera = new THREE.PerspectiveCamera(
        38,
        window.innerWidth / window.innerHeight,
        0.1,
        2000,
      );
      const defaultCamPos = new THREE.Vector3(140, 110, 170);
      camera.position.copy(defaultCamPos);
      camera.lookAt(0, 0, 0);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.minDistance = 60;
      controls.maxDistance = 380;
      controls.maxPolarAngle = Math.PI / 2.05;
      controls.target.set(0, 5, 0);

      // ---------- Lights ----------
      scene.add(new THREE.AmbientLight(0xfff3df, 0.6));
      const sun = new THREE.DirectionalLight(0xffe7b0, 1.15);
      sun.position.set(80, 140, 60);
      scene.add(sun);
      const back = new THREE.DirectionalLight(0xb6c8e0, 0.35);
      back.position.set(-90, 60, -120);
      scene.add(back);

      // ---------- Water / base plane with topographic rings ----------
      const waterUniforms = {
        uColorA: { value: new THREE.Color("#efe7d8") },
        uColorB: { value: new THREE.Color("#c9bfa9") },
        uRingColor: { value: new THREE.Color("#ffffff") },
      };
      const waterMat = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        transparent: true,
        vertexShader: /* glsl */ `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: /* glsl */ `
          varying vec2 vUv;
          uniform vec3 uColorA;
          uniform vec3 uColorB;
          uniform vec3 uRingColor;
          void main() {
            vec2 p = (vUv - 0.5) * 2.0;
            float d = length(p);
            vec3 base = mix(uColorA, uColorB, smoothstep(0.0, 1.0, d));
            float rings = smoothstep(0.45, 0.5, fract(d * 14.0)) - smoothstep(0.5, 0.55, fract(d * 14.0));
            float ringFade = smoothstep(1.1, 0.05, d);
            vec3 col = mix(base, uRingColor, rings * 0.35 * ringFade);
            float vignette = smoothstep(1.25, 0.2, d);
            col = mix(uColorA * 0.92, col, vignette);
            gl_FragColor = vec4(col, 1.0);
          }
        `,
      });
      const water = new THREE.Mesh(
        new THREE.PlaneGeometry(state.planeSize * 2.6, state.planeSize * 2.6, 1, 1),
        waterMat,
      );
      water.rotation.x = -Math.PI / 2;
      water.position.y = -0.05;
      scene.add(water);

      // ---------- Terrain ----------
      const MAX_COLORS = 12;
      const terrainUniforms = {
        uColors: { value: new Array(MAX_COLORS).fill(0).map(() => new THREE.Color("#888")) },
        uColorCount: { value: 1 },
        uMinY: { value: 0 },
        uMaxY: { value: 1 },
        uLightDir: { value: new THREE.Vector3(0.5, 0.8, 0.3).normalize() },
      };

      const terrainMat = new THREE.ShaderMaterial({
        uniforms: terrainUniforms,
        vertexShader: /* glsl */ `
          varying vec3 vWorldPos;
          varying vec3 vNormal;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
        fragmentShader: /* glsl */ `
          uniform vec3 uColors[${MAX_COLORS}];
          uniform int uColorCount;
          uniform float uMinY;
          uniform float uMaxY;
          uniform vec3 uLightDir;
          varying vec3 vWorldPos;
          varying vec3 vNormal;

          vec3 sampleGradient(float t) {
            t = clamp(t, 0.0, 1.0);
            float scaled = t * float(uColorCount - 1);
            int idx = int(floor(scaled));
            float f = fract(scaled);
            int nextIdx = idx + 1;
            if (nextIdx > uColorCount - 1) nextIdx = uColorCount - 1;
            vec3 a = uColors[0];
            vec3 b = uColors[0];
            for (int i = 0; i < ${MAX_COLORS}; i++) {
              if (i == idx) a = uColors[i];
              if (i == nextIdx) b = uColors[i];
            }
            return mix(a, b, f);
          }

          void main() {
            float t = (vWorldPos.y - uMinY) / max(0.0001, (uMaxY - uMinY));
            // gradient is applied only above 20% of the peak height,
            // below that we stay on the first color (avoids low-layer flickering)
            float gradT = clamp((t - 0.2) / 0.8, 0.0, 1.0);
            vec3 col = sampleGradient(gradT);
            vec3 N = normalize(vNormal);
            float diff = max(dot(N, normalize(uLightDir)), 0.0);
            float ao = smoothstep(-0.2, 1.0, N.y);
            col *= 0.45 + 0.55 * diff;
            col *= 0.75 + 0.25 * ao;
            float rim = pow(1.0 - max(dot(N, vec3(0.0,1.0,0.0)), 0.0), 2.0);
            col += rim * 0.04;
            gl_FragColor = vec4(col, 1.0);
          }
        `,
      });

      let terrainGeom = new THREE.PlaneGeometry(
        state.planeSize,
        state.planeSize,
        state.segments,
        state.segments,
      );
      terrainGeom.rotateX(-Math.PI / 2);
      const terrain = new THREE.Mesh(terrainGeom, terrainMat);
      scene.add(terrain);

      const labelGroup = new THREE.Group();
      scene.add(labelGroup);
      const labelObjects = [];

      // ---------- Helpers ----------
      function rotateArray(arr, offset) {
        if (!arr.length) return arr;
        const n = ((offset % arr.length) + arr.length) % arr.length;
        return arr.slice(n).concat(arr.slice(0, n));
      }

      function shufflePositions(items) {
        const radius = state.planeSize * 0.32;
        return items.map(() => {
          const a = Math.random() * Math.PI * 2;
          const r = Math.sqrt(Math.random()) * radius;
          return {
            x: Math.cos(a) * r,
            z: Math.sin(a) * r,
            widthJitter: 0.75 + Math.random() * 0.5,
            shape: 0.85 + Math.random() * 0.5,
          };
        });
      }

      function bumpAt(x, z, peaks) {
        let h = 0;
        for (const p of peaks) {
          const dx = x - p.x;
          const dz = z - p.z;
          const r = Math.sqrt(dx * dx + dz * dz);
          if (r > p.halfWidth) continue;
          const t = r / p.halfWidth;
          const k = p.shape;
          const profile = Math.pow(Math.cos((Math.PI * t) / 2), 1.6 * k);
          const local = p.height * profile;
          if (local > h) h = local;
        }
        return h;
      }

      function buildPeaks() {
        const items = state.landscape.items || [];
        const pos = state.positions;
        return items.map((item, i) => {
          const p = pos[i] || { x: 0, z: 0, widthJitter: 1, shape: 1 };
          const heightNorm = Math.max(1, Math.min(10, item.height)) / 10;
          return {
            name: item.title || item.name || `item ${i + 1}`,
            x: p.x,
            z: p.z,
            halfWidth: (state.baseWidth * p.widthJitter) / 2,
            height: heightNorm * state.maxHeight,
            shape: p.shape,
          };
        });
      }

      function rebuildTerrain() {
        const peaks = buildPeaks();
        const pos = terrainGeom.attributes.position;
        const bumpAmt = state.bumpAmount;
        const heightRef = Math.max(0.001, state.maxHeight * 0.1);
        let maxY = 0;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const h = bumpAt(x, z, peaks);
          // bump factor: small detail on flat ground, full strength on peaks
          const factor = 0.15 + 0.85 * Math.min(1, h / heightRef);
          const n = fbm(x, z) * bumpAmt * factor;
          const y = Math.max(0, h + n);
          pos.setY(i, y);
          if (y > maxY) maxY = y;
        }
        pos.needsUpdate = true;
        terrainGeom.computeVertexNormals();

        terrainUniforms.uMinY.value = 0;
        terrainUniforms.uMaxY.value = Math.max(0.01, maxY);

        updateLabels(peaks);
      }

      function applyGradient() {
        const colors = rotateArray(
          state.landscape.gradientColors || ["#888"],
          state.colorOffset,
        );
        const count = Math.min(colors.length, MAX_COLORS);
        for (let i = 0; i < count; i++) {
          terrainUniforms.uColors.value[i].set(colors[i]);
        }
        terrainUniforms.uColorCount.value = count;
      }

      function updateLabels(peaks) {
        for (const obj of labelObjects) {
          labelGroup.remove(obj);
          if (obj.element && obj.element.parentNode) {
            obj.element.parentNode.removeChild(obj.element);
          }
        }
        labelObjects.length = 0;
        for (const peak of peaks) {
          const div = document.createElement("div");
          div.className = "peak-label";
          div.textContent = peak.name;
          const obj = new CSS2DObject(div);
          obj.position.set(peak.x, peak.height + 6, peak.z);
          labelGroup.add(obj);
          labelObjects.push(obj);
        }
      }

      // ---------- Palette + title UI ----------
      function renderPalette() {
        const wrap = document.getElementById("paletteSwatches");
        wrap.innerHTML = "";
        const rotated = rotateArray(
          state.landscape.gradientColors || [],
          state.colorOffset,
        );
        rotated.forEach((color, i) => {
          const sw = document.createElement("div");
          sw.className =
            "h-7 w-7 rounded-md border border-black/20 shadow-inner";
          sw.style.background = color;
          sw.title = `${i}: ${color}`;
          wrap.appendChild(sw);
        });
      }

      function setLandscape(json) {
        state.landscape = json;
        state.positions = shufflePositions(json.items);
        document.getElementById("landscapeTitle").textContent = (
          json.name ||
          json.title ||
          "landscape"
        ).toUpperCase();
        const co = document.getElementById("colorOffset");
        co.max = String(Math.max(0, (json.gradientColors?.length || 1) - 1));
        renderPalette();
        applyGradient();
        rebuildTerrain();
      }

      // ---------- Controls binding ----------
      function bindControls() {
        const bw = document.getElementById("baseWidth");
        const mh = document.getElementById("maxHeight");
        const co = document.getElementById("colorOffset");
        const ba = document.getElementById("bumpAmount");

        bw.addEventListener("input", () => {
          state.baseWidth = +bw.value;
          document.getElementById("baseWidthValue").textContent = bw.value;
          rebuildTerrain();
        });
        mh.addEventListener("input", () => {
          state.maxHeight = +mh.value;
          document.getElementById("maxHeightValue").textContent = mh.value;
          rebuildTerrain();
        });
        co.addEventListener("input", () => {
          state.colorOffset = +co.value;
          document.getElementById("colorOffsetValue").textContent = co.value;
          renderPalette();
          applyGradient();
        });
        ba.addEventListener("input", () => {
          state.bumpAmount = +ba.value;
          document.getElementById("bumpAmountValue").textContent = (+ba.value)
            .toFixed(2);
          rebuildTerrain();
        });

        document.getElementById("reshuffle").addEventListener("click", () => {
          state.positions = shufflePositions(state.landscape.items);
          state.noiseSeed = Math.random() * 1000;
          rebuildTerrain();
        });

        document.getElementById("resetView").addEventListener("click", () => {
          camera.position.copy(defaultCamPos);
          controls.target.set(0, 5, 0);
          controls.update();
        });

        window.addEventListener("resize", onResize);
      }

      function onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h);
        labelRenderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }

      // ---------- Animation loop ----------
      function tick() {
        controls.update();
        renderer.render(scene, camera);
        labelRenderer.render(scene, camera);
        requestAnimationFrame(tick);
      }

      // ---------- Boot ----------
      bindControls();
      setLandscape(bauhausLandscape);
      tick();
    </script>
  </body>
</html>
